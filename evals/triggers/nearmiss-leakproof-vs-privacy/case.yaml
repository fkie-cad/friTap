schema_version: "1.1"
name: trigger-nearmiss-leakproof-vs-privacy
description: 'one known value: leak proof, not full privacy audit'
tags: [trigger, nearmiss]
runs: 3
execution:
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill]
  prompt: |
    No full audit needed. I just want proof whether my test email tester+42@example.org leaks to a tracker in the capture I already took with friTap.
graders:
  - name: fires-fritap-leak-proof
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fritap-leak-proof"'
    min: 1
    arm: both
  - name: not-fritap-privacy-audit
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fritap-privacy-audit"'
    min: 0
    max: 0
    arm: both
