schema_version: "1.1"
name: trigger-nearmiss-decrypt-vs-capture
description: 'existing pcap+keylog: offline decrypt, not live capture'
tags: [trigger, nearmiss]
runs: 3
execution:
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill]
  prompt: |
    I already have capture.pcapng and keys.log from an earlier friTap run. Show me the HTTP requests inside.
graders:
  - name: fires-fritap-decrypt
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fritap-decrypt"'
    min: 1
    arm: both
  - name: not-fritap-capture
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fritap-capture"'
    min: 0
    max: 0
    arm: both
