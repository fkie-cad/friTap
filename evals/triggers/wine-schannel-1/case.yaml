schema_version: "1.1"
name: trigger-wine-schannel-1
description: 'terse: Windows exe under Wine'
tags: [trigger, positive]
runs: 3
execution:
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill]
  prompt: |
    running a windows .exe through wine on ubuntu, want its TLS keys with fritap
graders:
  - name: fires-fritap-wine-schannel
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fritap-wine-schannel"'
    min: 1
    arm: both
