schema_version: "1.1"
name: trigger-memory-scan-2
description: 'specific: RC4 keys from a legacy client'
tags: [trigger, positive]
runs: 3
execution:
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill]
  prompt: |
    Our legacy client legacy_agent.exe still uses RC4 for its custom protocol. Can friTap scan its memory and recover the RC4 keys into a keylog?
graders:
  - name: fires-fritap-memory-scan
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fritap-memory-scan"'
    min: 1
    arm: both
