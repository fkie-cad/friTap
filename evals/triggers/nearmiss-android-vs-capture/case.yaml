schema_version: "1.1"
name: trigger-nearmiss-android-vs-capture
description: 'frida-server/adb setup trouble: android, not capture'
tags: [trigger, nearmiss]
runs: 3
execution:
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill]
  prompt: |
    friTap on my emulator fails with 'unable to connect to remote frida-server' - adb sees the device. Do I have the wrong frida-server version?
graders:
  - name: fires-fritap-android
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fritap-android"'
    min: 1
    arm: both
  - name: not-fritap-capture
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fritap-capture"'
    min: 0
    max: 0
    arm: both
