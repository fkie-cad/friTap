schema_version: "1.1"
name: trigger-nearmiss-telegram-vs-memscan
description: 'offline MTProto degraded streams: telegram, not memory scan'
tags: [trigger, nearmiss]
runs: 3
execution:
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill]
  prompt: |
    The offline MTProto decryption of my Telegram pcap says half the streams are 'degraded'. Why, and can I recover them?
graders:
  - name: fires-fritap-telegram
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fritap-telegram"'
    min: 1
    arm: both
  - name: not-fritap-memory-scan
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fritap-memory-scan"'
    min: 0
    max: 0
    arm: both
