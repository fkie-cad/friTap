schema_version: "1.1"
name: trigger-decrypt-1
description: 'German-English: pcap still encrypted'
tags: [trigger, positive]
runs: 3
execution:
  max_turns: 3
  timeout_seconds: 120
  allowed_tools: [Skill]
  prompt: |
    I opened the pcap in Wireshark together with the keylog file from friTap but still everything is encrypted, I see only TLS application data. What is wrong?
graders:
  - name: fires-fritap-decrypt
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?fritap-decrypt"'
    min: 1
    arm: both
